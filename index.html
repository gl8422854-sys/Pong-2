
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Atari Pong Modern Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #05070a;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .arcade-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 900px;
      background: #0d1117;
      border: 3px solid #1a2333;
      box-shadow: 0 0 30px rgba(0, 255, 170, 0.15), inset 0 0 15px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 500px) {
      .arcade-container {
        height: 95vh;
        border-radius: 20px;
      }
    }

    .arcade-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(13, 17, 23, 0.95);
      border-bottom: 2px solid #1f293d;
      z-index: 10;
    }

    .title-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 4px;
    }

    .title-logo {
      width: 12px;
      height: 12px;
      background: #00ffaa;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ffaa;
    }

    .title-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: #00ffaa;
      text-shadow: 0 0 6px rgba(0, 255, 170, 0.6);
      letter-spacing: 1px;
    }

    .title-sub {
      font-size: 10px;
      color: #4a5a75;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    .score-board {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      display: flex;
      gap: 12px;
      background: #080c14;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #1f2a3e;
    }

    .score-p1 { color: #00ffaa; }
    .score-p2 { color: #ffaa00; }
    .score-divider { color: #3a4b68; }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: #141c2b;
      border: 1px solid #28364f;
      color: #7a8ea8;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 12px;
    }

    .icon-btn:active {
      transform: scale(0.95);
      background: #00ffaa;
      color: #000;
    }

    .game-screen {
      position: relative;
      flex: 1;
      width: 100%;
      background: #040609;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0a0f18 0%, #030508 100%);
    }

    .touch-controls {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      pointer-events: none;
    }

    .touch-zone {
      flex: 1;
      height: 100%;
      pointer-events: auto;
    }

    .arcade-footer {
      padding: 10px 16px;
      background: #090d14;
      border-top: 1px solid #182232;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #4a5c78;
    }

    .mode-select {
      display: flex;
      gap: 6px;
    }

    .mode-btn {
      background: #101724;
      border: 1px solid #1d2b42;
      color: #617594;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .mode-btn.active {
      background: #00ffaa;
      color: #05070a;
      border-color: #00ffaa;
      box-shadow: 0 0 8px rgba(0, 255, 170, 0.4);
    }

    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #090c12;
      z-index: 999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .overlay-screen.active {
      display: flex;
    }

    .error-card {
      background: #0f1522;
      border: 1px solid #212e47;
      border-radius: 16px;
      padding: 30px 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .error-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: rgba(255, 50, 80, 0.1);
      border: 1px solid rgba(255, 50, 80, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ff3250;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .error-code {
      font-family: 'Press Start 2P', monospace;
      font-size: 42px;
      color: #ff3250;
      margin-bottom: 12px;
      letter-spacing: 2px;
      display: flex;
      gap: 4px;
    }

    .digit-btn {
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: inline-block;
      padding: 4px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .digit-btn:active {
      background: rgba(255, 50, 80, 0.2);
    }

    .error-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #e0e6ed;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .error-desc {
      font-size: 12px;
      color: #5c6e8a;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-return {
      background: #ff3250;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 50, 80, 0.4);
    }

    .vault-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #07090e;
      z-index: 1000;
      display: none;
      flex-direction: column;
    }

    .vault-screen.active {
      display: flex;
    }

    .vault-header {
      padding: 16px;
      background: #0d121c;
      border-bottom: 1px solid #1a2436;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .vault-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #00ffaa;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vault-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .vault-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .folder-select {
      flex: 1;
      background: #111724;
      border: 1px solid #1f2d45;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      outline: none;
    }

    .btn-new-folder {
      background: #141c2b;
      border: 1px solid #28364f;
      color: #00ffaa;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .upload-zone {
      border: 2px dashed #1e2c42;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      background: #0a0e17;
      cursor: pointer;
    }

    .upload-icon {
      font-size: 20px;
      color: #00ffaa;
      margin-bottom: 4px;
    }

    .upload-text {
      font-size: 12px;
      color: #7a8ea8;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .media-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: #111724;
      border: 1px solid #1c273a;
      cursor: pointer;
    }

    .media-item img, .media-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .media-actions {
      position: absolute;
      top: 4px;
      right: 4px;
      display: flex;
      gap: 4px;
    }

    .media-btn-mini {
      background: rgba(0,0,0,0.8);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .media-btn-mini.del { color: #ff3250; }

    .lightbox {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 1100;
      display: none;
      flex-direction: column;
      justify-content: space-between;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13,18,28,0.85);
      z-index: 10;
    }

    .lightbox-info {
      font-size: 12px;
      color: #8fa4c4;
    }

    .lightbox-body {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: pan-y;
      background: #000;
    }

    .lightbox-content {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .lightbox-footer {
      padding: 16px;
      display: flex;
      justify-content: space-around;
      background: rgba(13,18,28,0.85);
      z-index: 10;
    }

    .lightbox-action-btn {
      background: #162235;
      border: 1px solid #283a59;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lightbox-action-btn:active {
      background: #00ffaa;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="arcade-container">
    <div class="arcade-header">
      <div class="title-badge" id="titleTrigger">
        <div class="title-logo"></div>
        <div>
          <div class="title-text">PONG</div>
          <div class="title-sub">MODERN 2600 EDITION</div>
        </div>
      </div>

      <div class="score-board">
        <span class="score-p1" id="scoreP1">0</span>
        <span class="score-divider">:</span>
        <span class="score-p2" id="scoreP2">0</span>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="btnPause">⏸</button>
        <button class="icon-btn" id="btnReset">↺</button>
      </div>
    </div>

    <div class="game-screen">
      <canvas id="pongCanvas"></canvas>
      <div class="touch-controls">
        <div class="touch-zone" id="touchP1"></div>
        <div class="touch-zone" id="touchP2"></div>
      </div>
    </div>

    <div class="arcade-footer">
      <div class="mode-select">
        <button class="mode-btn active" id="btnModeCpu">VS CPU</button>
        <button class="mode-btn" id="btnMode2P">2 PLAYERS</button>
      </div>
      <div>CONTROLES: W/S ou TOQUE</div>
    </div>

    <!-- 404 SCREEN -->
    <div class="overlay-screen" id="screen404">
      <div class="error-card">
        <div class="error-icon">⚠️</div>
        <div class="error-code">
          <span class="digit-btn" id="d1">4</span><span class="digit-btn" id="d2">0</span><span class="digit-btn" id="d3">4</span>
        </div>
        <div class="error-title">PÁGINA NÃO ENCONTRADA</div>
        <div class="error-desc">[ERRO ATARI-2600]: O recurso solicitado não existe ou foi desconectado do barramento de memória.</div>
        <button class="btn-return" id="btnReturnGame">← VOLTAR AO JOGO</button>
      </div>
    </div>

    <!-- SECRET VAULT -->
    <div class="vault-screen" id="screenVault">
      <div class="vault-header">
        <div class="vault-title">🔒 COFRE PRIVADO</div>
        <button class="icon-btn" id="btnCloseVault">✕</button>
      </div>
      <div class="vault-body">
        <div class="vault-toolbar">
          <select class="folder-select" id="folderSelect">
            <option value="Geral">📁 Geral</option>
          </select>
          <button class="btn-new-folder" id="btnNewFolder">+ Pasta</button>
        </div>

        <div class="upload-zone" id="uploadZone">
          <div class="upload-icon">📁</div>
          <div class="upload-text">Toque para adicionar fotos ou vídeos na pasta atual</div>
          <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display:none">
        </div>

        <div class="media-grid" id="mediaGrid"></div>
      </div>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
      <div class="lightbox-header">
        <div class="lightbox-info" id="lightboxInfo">Pasta: Geral</div>
        <button class="icon-btn" id="btnCloseLightbox">✕</button>
      </div>

      <div class="lightbox-body" id="lightboxBody">
        <div id="lightboxMediaContainer" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;"></div>
      </div>

      <div class="lightbox-footer">
        <button class="lightbox-action-btn" id="btnRestoreMedia">📥 Restaurar</button>
        <button class="lightbox-action-btn" id="btnMoveMedia" style="color:#ffaa00;">📁 Mover Pasta</button>
      </div>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('pongCanvas');
    const ctx = canvas.getContext('2d');

    let isVsCpu = true;
    let isPaused = false;
    let scoreP1 = 0;
    let scoreP2 = 0;

    const paddleWidth = 10;
    const paddleHeight = 70;
    let p1Y = 0;
    let p2Y = 0;

    let ballX = 0, ballY = 0;
    let ballSpeedX = 4, ballSpeedY = 3;
    const ballSize = 8;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      if (p1Y === 0) p1Y = (canvas.height - paddleHeight) / 2;
      if (p2Y === 0) p2Y = (canvas.height - paddleHeight) / 2;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function resetBall() {
      ballX = canvas.width / 2;
      ballY = canvas.height / 2;
      ballSpeedX = (Math.random() > 0.5 ? 1 : -1) * 4;
      ballSpeedY = (Math.random() * 2 - 1) * 4;
    }

    function updateGame() {
      if (isPaused) return;

      ballX += ballSpeedX;
      ballY += ballSpeedY;

      if (ballY <= 0 || ballY >= canvas.height - ballSize) {
        ballSpeedY *= -1;
      }

      if (isVsCpu) {
        const cpuSpeed = 3.5;
        const targetY = ballY - paddleHeight / 2;
        if (p2Y < targetY) p2Y += cpuSpeed;
        else if (p2Y > targetY) p2Y -= cpuSpeed;
      }

      p1Y = Math.max(0, Math.min(canvas.height - paddleHeight, p1Y));
      p2Y = Math.max(0, Math.min(canvas.height - paddleHeight, p2Y));

      if (ballX <= 20 + paddleWidth && ballY + ballSize >= p1Y && ballY <= p1Y + paddleHeight) {
        ballSpeedX = Math.abs(ballSpeedX) * 1.05;
        ballX = 20 + paddleWidth;
      }

      if (ballX >= canvas.width - 20 - paddleWidth - ballSize && ballY + ballSize >= p2Y && ballY <= p2Y + paddleHeight) {
        ballSpeedX = -Math.abs(ballSpeedX) * 1.05;
        ballX = canvas.width - 20 - paddleWidth - ballSize;
      }

      if (ballX < 0) {
        scoreP2++;
        document.getElementById('scoreP2').innerText = scoreP2;
        resetBall();
      } else if (ballX > canvas.width) {
        scoreP1++;
        document.getElementById('scoreP1').innerText = scoreP1;
        resetBall();
      }
    }

    function renderGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#1e2d42';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#00ffaa';
      ctx.fillRect(20, p1Y, paddleWidth, paddleHeight);

      ctx.fillStyle = '#ffaa00';
      ctx.fillRect(canvas.width - 20 - paddleWidth, p2Y, paddleWidth, paddleHeight);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(ballX, ballY, ballSize, ballSize);
    }

    function gameLoop() {
      updateGame();
      renderGame();
      requestAnimationFrame(gameLoop);
    }

    resetBall();
    gameLoop();

    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W') p1Y -= 20;
      if (e.key === 's' || e.key === 'S') p1Y += 20;
      if (!isVsCpu) {
        if (e.key === 'ArrowUp') p2Y -= 20;
        if (e.key === 'ArrowDown') p2Y += 20;
      }
      if (document.getElementById('lightbox').classList.contains('active')) {
        if (e.key === 'ArrowLeft') showPrevMedia();
        if (e.key === 'ArrowRight') showNextMedia();
      }
    });

    const touchP1 = document.getElementById('touchP1');
    const touchP2 = document.getElementById('touchP2');

    touchP1.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      p1Y = e.touches[0].clientY - rect.top - paddleHeight / 2;
    });

    touchP2.addEventListener('touchmove', (e) => {
      if (!isVsCpu) {
        const rect = canvas.getBoundingClientRect();
        p2Y = e.touches[0].clientY - rect.top - paddleHeight / 2;
      }
    });

    document.getElementById('btnPause').addEventListener('click', () => {
      isPaused = !isPaused;
      document.getElementById('btnPause').innerText = isPaused ? '▶' : '⏸';
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      scoreP1 = 0;
      scoreP2 = 0;
      document.getElementById('scoreP1').innerText = '0';
      document.getElementById('scoreP2').innerText = '0';
      resetBall();
    });

    document.getElementById('btnModeCpu').addEventListener('click', () => {
      isVsCpu = true;
      document.getElementById('btnModeCpu').classList.add('active');
      document.getElementById('btnMode2P').classList.remove('active');
    });

    document.getElementById('btnMode2P').addEventListener('click', () => {
      isVsCpu = false;
      document.getElementById('btnMode2P').classList.add('active');
      document.getElementById('btnModeCpu').classList.remove('active');
    });

    let titleTaps = 0;
    let titleTapTimer;

    const titleTrigger = document.getElementById('titleTrigger');
    titleTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      titleTaps++;
      clearTimeout(titleTapTimer);
      if (titleTaps === 12) {
        titleTaps = 0;
        document.getElementById('screen404').classList.add('active');
      } else {
        titleTapTimer = setTimeout(() => { titleTaps = 0; }, 3000);
      }
    });

    document.getElementById('btnReturnGame').addEventListener('click', () => {
      document.getElementById('screen404').classList.remove('active');
      seqState = { d1: 0, d2: 0, d3: 0 };
    });

    let seqState = { d1: 0, d2: 0, d3: 0 };

    document.getElementById('d1').addEventListener('click', (e) => {
      e.stopPropagation();
      seqState.d1++;
      checkVaultSequence();
    });

    document.getElementById('d2').addEventListener('click', (e) => {
      e.stopPropagation();
      if (seqState.d1 >= 1) seqState.d2++;
      else seqState = { d1: 0, d2: 0, d3: 0 };
      checkVaultSequence();
    });

    document.getElementById('d3').addEventListener('click', (e) => {
      e.stopPropagation();
      if (seqState.d1 >= 1 && seqState.d2 >= 3) seqState.d3++;
      else seqState = { d1: 0, d2: 0, d3: 0 };
      checkVaultSequence();
    });

    function checkVaultSequence() {
      if (seqState.d1 >= 1 && seqState.d2 >= 3 && seqState.d3 >= 4) {
        seqState = { d1: 0, d2: 0, d3: 0 };
        document.getElementById('screen404').classList.remove('active');
        document.getElementById('screenVault').classList.add('active');
        loadFolders();
        loadVaultMedia();
      }
    }

    document.getElementById('btnCloseVault').addEventListener('click', () => {
      document.getElementById('screenVault').classList.remove('active');
    });

    let db = null;
    let currentFolderItems = [];
    let currentLightboxIndex = 0;

    const dbReq = indexedDB.open("AtariVaultDB_Safe", 1);

    dbReq.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("media")) {
        db.createObjectStore("media", { keyPath: "id", autoIncrement: true });
      }
      if (!db.objectStoreNames.contains("folders")) {
        db.createObjectStore("folders", { keyPath: "name" });
      }
    };

    dbReq.onsuccess = (e) => {
      db = e.target.result;
      const tx = db.transaction("folders", "readwrite");
      tx.objectStore("folders").put({ name: "Geral" });
    };

    function loadFolders() {
      if (!db) return;
      const select = document.getElementById('folderSelect');
      select.innerHTML = '';
      const tx = db.transaction("folders", "readonly");
      const req = tx.objectStore("folders").getAll();

      req.onsuccess = () => {
        const folders = req.result;
        if (folders.length === 0) {
          const opt = document.createElement('option');
          opt.value = "Geral";
          opt.innerText = "📁 Geral";
          select.appendChild(opt);
        } else {
          folders.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f.name;
            opt.innerText = `📁 ${f.name}`;
            select.appendChild(opt);
          });
        }
      };
    }

    document.getElementById('btnNewFolder').addEventListener('click', () => {
      const name = prompt("Nome da nova pasta:");
      if (!name || !name.trim()) return;
      const folderName = name.trim();

      const tx = db.transaction("folders", "readwrite");
      tx.objectStore("folders").put({ name: folderName });
      tx.oncomplete = () => {
        loadFolders();
        document.getElementById('folderSelect').value = folderName;
        loadVaultMedia();
      };
    });

    document.getElementById('folderSelect').addEventListener('change', () => {
      loadVaultMedia();
    });

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');

    uploadZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const files = e.target.files;
      if (!files.length) return;
      const currentFolder = document.getElementById('folderSelect').value || "Geral";

      for (let file of files) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const tx = db.transaction("media", "readwrite");
          tx.objectStore("media").add({
            type: file.type.startsWith('video') ? 'video' : 'image',
            data: evt.target.result,
            name: file.name || "midia",
            folder: currentFolder,
            date: new Date()
          });
          tx.oncomplete = () => loadVaultMedia();
        };
        reader.readAsDataURL(file);
      }
    });

    function loadVaultMedia() {
      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = '';
      if (!db) return;

      const currentFolder = document.getElementById('folderSelect').value || "Geral";
      const tx = db.transaction("media", "readonly");
      const req = tx.objectStore("media").getAll();

      req.onsuccess = () => {
        const items = req.result;
        currentFolderItems = items.filter(item => (item.folder || "Geral") === currentFolder);

        currentFolderItems.forEach((item, index) => {
          const mediaDiv = document.createElement('div');
          mediaDiv.className = 'media-item';

          let el;
          if (item.type === 'image') {
            el = document.createElement('img');
            el.src = item.data;
          } else {
            el = document.createElement('video');
            el.src = item.data;
          }

          mediaDiv.addEventListener('click', () => openLightbox(index));

          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'media-actions';

          const restoreBtn = document.createElement('button');
          restoreBtn.className = 'media-btn-mini';
          restoreBtn.innerText = '📥';
          restoreBtn.title = 'Restaurar/Baixar';
          restoreBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            restoreMediaItem(item);
          });

          const delBtn = document.createElement('button');
          delBtn.className = 'media-btn-mini del';
          delBtn.innerText = '✕';
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteMedia(item.id);
          });

          actionsDiv.appendChild(restoreBtn);
          actionsDiv.appendChild(delBtn);
          mediaDiv.appendChild(el);
          mediaDiv.appendChild(actionsDiv);
          grid.appendChild(mediaDiv);
        });
      };
    }

    function deleteMedia(id) {
      if (!confirm("Deseja excluir permanentemente?")) return;
      const tx = db.transaction("media", "readwrite");
      tx.objectStore("media").delete(id);
      tx.oncomplete = () => loadVaultMedia();
    }

    function restoreMediaItem(item) {
      const a = document.createElement('a');
      a.href = item.data;
      a.download = item.name || (item.type === 'image' ? 'foto_restaurada.jpg' : 'video_restaurado.mp4');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function openLightbox(index) {
      if (!currentFolderItems.length) return;
      currentLightboxIndex = index;
      renderLightboxMedia();
      document.getElementById('lightbox').classList.add('active');
    }

    function renderLightboxMedia() {
      const item = currentFolderItems[currentLightboxIndex];
      if (!item) return;

      const container = document.getElementById('lightboxMediaContainer');
      container.innerHTML = '';
      document.getElementById('lightboxInfo').innerText = `${currentLightboxIndex + 1}/${currentFolderItems.length} - ${item.folder || 'Geral'}`;

      if (item.type === 'image') {
        const img = document.createElement('img');
        img.src = item.data;
        img.className = 'lightbox-content';
        container.appendChild(img);
      } else {
        const video = document.createElement('video');
        video.src = item.data;
        video.controls = true;
        video.autoplay = true;
        video.className = 'lightbox-content';
        container.appendChild(video);
      }
    }

    function showPrevMedia() {
      if (currentLightboxIndex > 0) {
        currentLightboxIndex--;
        renderLightboxMedia();
      }
    }

    function showNextMedia() {
      if (currentLightboxIndex < currentFolderItems.length - 1) {
        currentLightboxIndex++;
        renderLightboxMedia();
      }
    }

    let touchStartX = 0;
    let touchEndX = 0;
    const lightboxBody = document.getElementById('lightboxBody');

    lightboxBody.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    lightboxBody.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 40) {
        if (diff < 0) {
          showNextMedia();
        } else {
          showPrevMedia();
        }
      }
    }, { passive: true });

    document.getElementById('btnCloseLightbox').addEventListener('click', () => {
      document.getElementById('lightbox').classList.remove('active');
      document.getElementById('lightboxMediaContainer').innerHTML = '';
    });

    document.getElementById('btnRestoreMedia').addEventListener('click', () => {
      const item = currentFolderItems[currentLightboxIndex];
      if (item) restoreMediaItem(item);
    });

    document.getElementById('btnMoveMedia').addEventListener('click', () => {
      const item = currentFolderItems[currentLightboxIndex];
      if (!item) return;
      const newFolder = prompt("Mover para qual pasta?", item.folder || "Geral");
      if (!newFolder) return;

      const tx = db.transaction("media", "readwrite");
      item.folder = newFolder.trim();
      tx.objectStore("media").put(item);
      tx.oncomplete = () => {
        loadFolders();
        loadVaultMedia();
        document.getElementById('lightbox').classList.remove('active');
        alert("Item movido com sucesso!");
      };
    });
  </script>
</body>
</html>
